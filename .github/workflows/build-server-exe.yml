name: Build Fuad's Server (Windows exe)

on:
  push:
    tags:
      - "server-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (example: server-v1.0.0)"
        required: true
        default: "server-v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools (PyInstaller bootloader compiled from source)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pystray pillow pywebview
          # The stock PyInstaller bootloader is the most common reason for antivirus false alarms: build our own.
          python -m pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not compile the bootloader; using the prebuilt PyInstaller."
            python -m pip install pyinstaller
          }

      - name: Stamp version and write exe version info
        run: python .github/prepare_build.py

      - name: Build Fuads_Server.exe
        run: >
          pyinstaller --onefile --windowed --noconfirm
          --name Fuads_Server
          --icon fuads_project_server.ico
          --version-file version_info.txt
          --noupx
          --add-data "fuads_project_server.ico;."
          --add-data "server_panel.html;."
          --add-data "index.html;."
          --hidden-import fuads_workspaces
          --hidden-import pystray._win32
          --collect-all webview
          Fuads_Server_App.py

      - name: Download cloudflared (for your own Cloudflare tunnel)
        run: Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile dist\cloudflared.exe

      - name: Smoke test - the built exe must start, serve the panel and answer /health
        run: |
          $env:FAAH_SERVER_DIR = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force $env:FAAH_SERVER_DIR | Out-Null
          $p = Start-Process -FilePath "dist\Fuads_Server.exe" -ArgumentList "--autostart","--panel-port","47820" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Seconds 1
            try {
              $h = Invoke-WebRequest -Uri "http://127.0.0.1:8765/health" -UseBasicParsing -TimeoutSec 3
              $a = Invoke-WebRequest -Uri "http://127.0.0.1:47820/" -UseBasicParsing -TimeoutSec 3
              if ($h.Content -match '"status": "ok"' -and $a.Content -match "Fuad") { $ok = $true; break }
            } catch { }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Get-Content (Join-Path $env:FAAH_SERVER_DIR "background_server.log") -ErrorAction SilentlyContinue
            throw "The built exe did not start the server and the control panel."
          }
          Write-Host "Smoke test passed."

      - name: Package
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist\Fuads_Server.exe pkg\
          Copy-Item dist\cloudflared.exe pkg\
          @"
          Fuad's Server (Fuad's Project Server)
          ======================================
          1. Double-click Fuads_Server.exe and sign in with your website admin account.
          2. The server starts by itself. Copy the Connection code into the website:
             Admin > PC Project Server > Server Settings.
          3. Turn on "Start with Windows" on the Overview page: the server then starts at every sign-in, with only a tray icon.
          4. Temporary link / own Cloudflare tunnel: see the Connections page.
             Keep cloudflared.exe in the same folder as Fuads_Server.exe (or let the app download it).
          5. Daily copies: every project is saved on this PC once a day; open older days from the date box on the website.
          Windows may show a SmartScreen warning because the app is not code-signed:
          click "More info" then "Run anyway".
          "@ | Set-Content pkg\README_FIRST.txt
          Compress-Archive -Path pkg\* -DestinationPath Fuads_Server_Windows.zip -Force
          Copy-Item dist\Fuads_Server.exe Fuads_Server.exe
          $hash = (Get-FileHash Fuads_Server.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Fuads_Server.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
          "SHA256_EXE=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Windows app for Fuad's Project Server. Download Fuads_Server_Windows.zip (includes cloudflared for your own Cloudflare tunnel), unzip it, and run Fuads_Server.exe. Fuads_Server.exe alone is the same app without cloudflared. Installed copies update themselves from here.`n`nSHA-256 of Fuads_Server.exe: $env:SHA256_EXE`n`nIf your antivirus flags the file it is a false alarm (the app is open source and not code-signed): you can report it at https://www.microsoft.com/en-us/wdsi/filesubmission and send the hash above."
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG Fuads_Server_Windows.zip Fuads_Server.exe SHA256SUMS.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG Fuads_Server_Windows.zip Fuads_Server.exe SHA256SUMS.txt --title "Fuad's Server $env:RELEASE_TAG" --notes $notes --target ${{ github.sha }}
          }
